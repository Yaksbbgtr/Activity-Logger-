<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activity Logger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Activity">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<style>
  :root {
    --bg: #0c0c0d; --surface: #161618; --field: #1e1e21;
    --line: rgba(255,255,255,.07); --line-strong: rgba(255,255,255,.13);
    --text: #f2efe8; --muted: #8f8a82; --faint: #5f5b55;
    --gold: #c9ab84; --gold-line: rgba(201,171,132,.45); --gold-soft: rgba(201,171,132,.13); --on-gold: #17140f;
    --warn: #d9907e; --ok: #c9ab84;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f3ee; --surface: #fffdf9; --field: #f1ece4;
      --line: rgba(40,30,20,.08); --line-strong: rgba(40,30,20,.15);
      --text: #1c1a17; --muted: #7a7268; --faint: #aaa196;
      --gold: #a3825a; --gold-line: rgba(163,130,90,.5); --gold-soft: rgba(163,130,90,.12); --on-gold: #fff;
      --warn: #b4533f; --ok: #a3825a;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main { max-width: 620px; margin: 0 auto; padding: 28px 16px 72px; }

  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .logo { display: block; width: 44px; height: 44px; border-radius: 11px; border: 1px solid var(--line); }
  .logo-btn { padding: 0; border: 0; border-radius: 11px; background: none; flex: none; transition: transform .15s, opacity .15s; }
  .logo-btn:active { transform: scale(.94); }
  body.menu-open .logo-btn { opacity: .6; }
  h1 { margin: 0; font-size: 1.45rem; font-weight: 600; letter-spacing: -.02em; }
  .sub { margin: 1px 0 0; color: var(--muted); font-size: .9rem; }
  .eyebrow { margin: 0 0 14px; font-size: .7rem; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 22px; padding: 22px 20px; margin-bottom: 14px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .spread { justify-content: space-between; }

  button {
    font: inherit; font-size: .92rem; font-weight: 500; letter-spacing: .01em;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line-strong); background: transparent; color: var(--text);
    transition: opacity .15s, background .15s;
  }
  button:active { opacity: .7; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--gold); color: var(--on-gold); border-color: transparent; }
  button.quiet { border: 0; padding: 6px 0; color: var(--muted); font-weight: 400; }
  button.quiet.danger { color: var(--warn); }

  input, textarea {
    font: inherit; font-size: 17px; color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; max-width: 100%;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus { border-color: var(--gold-line); box-shadow: 0 0 0 3px var(--gold-soft); }
  input[type=url], input[type=password] { width: 100%; }
  input[type=time] { padding: 9px 12px; min-width: 0; flex: 1 1 0; width: 100%; font-variant-numeric: tabular-nums; }
  input[type=time]::-webkit-calendar-picker-indicator { display: none; }
  input[type=time]::-webkit-date-and-time-value { text-align: left; }
  textarea { width: 100%; min-height: 120px; resize: none; line-height: 1.45; }
  label.block { display: block; margin-bottom: 14px; font-size: .85rem; color: var(--muted); }
  label.block input { margin-top: 6px; }

  .muted { color: var(--muted); }
  .ok { color: var(--ok); }
  .err { color: var(--warn); font-size: .88rem; }

  /* Prompt */
  #prompt {
    border-color: var(--gold-line);
    background: linear-gradient(180deg, var(--gold-soft), transparent 70%), var(--surface);
  }
  #prompt h2 { margin: 0 0 4px; font-size: 1.3rem; font-weight: 500; letter-spacing: -.01em; }
  #prompt .eyebrow { color: var(--gold); }
  #prompt-time { margin: 0 0 16px; font-size: .88rem; }

  /* Status */
  .next-time {
    font-size: 2.7rem; font-weight: 200; letter-spacing: -.03em; line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }
  .next-day { color: var(--muted); font-size: .95rem; margin-top: 4px; }
  .divider { height: 1px; background: var(--line); margin: 18px 0; border: 0; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin-right: 8px; vertical-align: 1px; }
  #reminders { font-size: .92rem; }

  /* Schedule */
  .interval input { width: 64px; text-align: center; margin: 0 6px; }
  .window { padding: 16px 0; border-top: 1px solid var(--line); }
  .window:first-child { margin-top: 16px; }
  .times { display: flex; align-items: center; gap: 10px; }
  .times .to { color: var(--faint); }
  .times .remove { flex: none; width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 0; color: var(--faint); font-size: 1.3rem; line-height: 1; }
  .days { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .day {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 34px; border-radius: 999px; font-size: .8rem; cursor: pointer;
    border: 1px solid var(--line-strong); color: var(--muted); user-select: none;
  }
  .day input { position: absolute; opacity: 0; pointer-events: none; }
  .day:has(input:checked) { background: var(--gold-soft); border-color: var(--gold-line); color: var(--gold); }
  .day:has(input:focus-visible) { box-shadow: 0 0 0 3px var(--gold-soft); }
  #saved { font-size: .85rem; }

  /* Log */
  .log-day { margin: 20px 0 2px; font-size: .7rem; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  .log-day:first-child { margin-top: 4px; }
  .entry { display: grid; grid-template-columns: 74px 1fr; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: 0; }
  .entry time { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .entry .text { white-space: pre-wrap; word-break: break-word; }
  .entry .meta { font-size: .78rem; color: var(--faint); margin-top: 2px; }
  .entry.missed .text { color: var(--warn); font-style: italic; opacity: .85; }
  #empty { margin: 4px 0 0; font-size: .92rem; }


  /* Header + menu */
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
  #drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 84vw); z-index: 11;
    background: var(--surface); border-right: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 24px) 12px 24px;
    transform: translateX(-100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
  }
  body.menu-open #scrim { opacity: 1; pointer-events: auto; }
  body.menu-open #drawer { transform: none; }
  body { touch-action: pan-y; }
  body.dragging #drawer, body.dragging #scrim { transition: none; }
  #drawer .eyebrow { padding: 0 12px; }
  .nav-item {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    border: 0; border-radius: 14px; padding: 14px 12px; font-size: 1rem; font-weight: 400;
  }
  .nav-item svg { width: 20px; height: 20px; color: var(--gold); flex: none; }
  .nav-item[aria-current=page] { background: var(--gold-soft); }
  .nav-item .chev { margin-left: auto; color: var(--faint); }
  .view-title { font-size: 1.45rem; font-weight: 600; letter-spacing: -.02em; margin: 0; }

  /* Check-in home */
  #checkin { padding-top: 26px; }
  #checkin.pending { border-color: var(--gold-line); background: linear-gradient(180deg, var(--gold-soft), transparent 70%), var(--surface); }
  #checkin.pending .eyebrow { color: var(--gold); }
  #checkin h2 { margin: 0 0 4px; font-size: 1.35rem; font-weight: 500; letter-spacing: -.01em; }
  #checkin-meta { margin: 0 0 18px; font-size: .9rem; }
  #logged { font-size: .9rem; }
  .nudge { margin-top: 14px; font-size: .9rem; color: var(--muted); text-align: center; }
  .nudge button { padding: 0; border: 0; color: var(--gold); font-weight: 500; font-size: inherit; }
  footer { text-align: center; margin-top: 26px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand">
      <button class="logo-btn" id="menu-btn" aria-label="Menu" aria-expanded="false" hidden><img class="logo" src="icon-192.png" alt=""></button>
      <div id="brand-text">
        <h1>Activity Logger</h1>
      </div>
      <h1 class="view-title" id="view-title" hidden></h1>
    </div>
  </header>

  <!-- Shown until the app knows its server and key -->
  <section class="card" id="connect" hidden>
    <p class="eyebrow">Connect</p>
    <label class="block" id="server-field">Server address
      <input type="url" id="server" placeholder="https://activity-logger.example.workers.dev" autocomplete="off">
    </label>
    <label class="block">App key
      <input type="password" id="key" autocomplete="off">
    </label>
    <div class="row"><button class="primary" id="connect-btn">Connect</button><span id="connect-msg" class="err"></span></div>
  </section>

  <div id="app" hidden>
    <!-- Home: the check-in screen -->
    <section data-view="home">
      <div class="card" id="checkin">
        <p class="eyebrow" id="checkin-label">Check-in</p>
        <h2>What are you doing right now?</h2>
        <p class="muted" id="checkin-meta"></p>
        <textarea id="response" placeholder="Type your answer…" enterkeyhint="send"></textarea>
        <div class="row" style="margin-top:12px">
          <button class="primary" id="submit">Log it</button>
          <span id="logged" class="ok"></span>
          <span id="submit-msg" class="err"></span>
        </div>
      </div>
      <p class="nudge" id="nudge" hidden>Reminders are off on this device. <button data-go="reminders">Turn on</button></p>
    </section>

    <section data-view="reminders" hidden>
      <div class="card">
        <p class="eyebrow" id="status">Next reminder</p>
        <div class="next-time" id="next-time">—</div>
        <div class="next-day" id="next"></div>
        <hr class="divider">
        <div id="reminders"></div>
        <div class="row" style="margin-top:14px">
          <button id="test">Ask me now</button>
          <button id="refresh">Refresh</button>
        </div>
      </div>
      <footer><button class="quiet" id="disconnect">Disconnect this device</button></footer>
    </section>

    <section data-view="schedule" hidden>
      <div class="card">
        <div class="row spread">
          <p class="eyebrow" style="margin:0">How often</p>
          <span class="muted" id="saved"></span>
        </div>
        <label class="interval" style="display:block;margin-top:16px">Every<input id="interval" type="number" inputmode="numeric" min="1" max="240">minutes</label>
        <div id="windows"></div>
        <button id="add-window" style="margin-top:6px">Add time frame</button>
      </div>
    </section>

    <section data-view="log" hidden>
      <div class="card">
        <div class="row spread" style="margin-bottom:6px">
          <p class="eyebrow" style="margin:0">Entries</p>
          <div class="row" style="gap:18px">
            <button class="quiet" id="export">Export</button>
            <button class="quiet danger" id="clear">Clear</button>
          </div>
        </div>
        <div id="log"></div>
        <p class="muted" id="empty">No entries yet.</p>
      </div>
    </section>
  </div>
</main>

<div id="scrim"></div>
<nav id="drawer" aria-label="Menu" inert>
  <p class="eyebrow">Menu</p>
  <button class="nav-item" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M13 7l4 4"/></svg>Check-in<span class="chev">›</span></button>
  <button class="nav-item" data-go="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 9.5l1.5 1.5 3-3M14.5 10H17M8 15h9"/></svg>Log<span class="chev">›</span></button>
  <button class="nav-item" data-go="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>Schedule<span class="chev">›</span></button>
  <button class="nav-item" data-go="reminders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>Reminders<span class="chev">›</span></button>
</nav>

<script src="config.js?v=2"></script>
<script>
(() => {
  const DAY_SHORT = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
  const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0]; // Monday first
  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };
  const fmt = (iso) => (iso ? new Date(iso).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) : '');
  const toMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const installed = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

  const DEFAULT_SERVER = window.ACTIVITY_LOGGER_SERVER || 'https://activity-logger.activity-logger-worker.workers.dev';
  let server = (store.get('al.server') || DEFAULT_SERVER).replace(/\/+$/, '');
  let key = store.get('al.key') || '';
  let data = { settings: null, pending: null, log: [], devices: 0 };
  let swReg = null;

  // ---- Server ------------------------------------------------------------

  async function api(method, path, body) {
    const res = await fetch(server + path, {
      method,
      headers: { Authorization: 'Bearer ' + key, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(json.error || `Server error ${res.status}`), { status: res.status });
    return json;
  }

  async function refresh() {
    try {
      data = await api('GET', '/api/state');
      // Keep the server's time zone in step with this device.
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (tz && data.settings.timezone !== tz) {
        data.settings = (await api('PUT', '/api/settings', { ...data.settings, timezone: tz })).settings;
      }
      render();
    } catch (err) {
      if (err.status === 401) { showConnect('That app key was not accepted.'); return; }
      $('status').textContent = 'Can’t reach the server';
      $('next').textContent = err.message;
    }
  }

  // ---- Connect ----------------------------------------------------------

  function showConnect(msg = '') {
    $('connect').hidden = false;
    $('app').hidden = true;
    $('server').value = server;
    $('server-field').hidden = Boolean(server);
    $('connect-msg').textContent = msg;
  }

  async function connect() {
    server = ($('server').value.trim() || DEFAULT_SERVER).replace(/\/+$/, '');
    key = $('key').value.trim();
    if (!key) { $('connect-msg').textContent = 'Enter your app key.'; return; }
    $('connect-btn').disabled = true;
    try {
      await api('GET', '/api/state');
      store.set('al.server', server);
      store.set('al.key', key);
      start();
    } catch (err) {
      $('connect-msg').textContent = err.status === 401 ? 'That app key was not accepted.' : 'Could not reach the server. Check your connection and try again.';
    } finally {
      $('connect-btn').disabled = false;
    }
  }

  // ---- Push reminders ---------------------------------------------------

  async function currentSubscription() {
    if (!pushSupported) return null;
    swReg = swReg || await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    return swReg.pushManager.getSubscription();
  }

  async function enableReminders() {
    const btn = $('enable');
    btn.disabled = true;
    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') { renderReminders('Notifications were not allowed. You can allow them in Settings.'); return; }
      const { key: vapidKey } = await api('GET', '/api/vapid-key');
      if (!vapidKey) throw new Error('Server has no push key configured.');
      await currentSubscription();
      const sub = await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidKey });
      await api('POST', '/api/subscribe', { subscription: sub.toJSON() });
      await refresh();
      renderReminders();
    } catch (err) {
      renderReminders('Could not turn on reminders: ' + err.message);
    } finally {
      btn && (btn.disabled = false);
    }
  }

  async function renderReminders(error = '') {
    const box = $('reminders');
    if (!pushSupported || (isIOS && !installed)) {
      box.innerHTML = isIOS
        ? '<strong>To get reminders on iPhone:</strong> tap the Share button, choose <em>Add to Home Screen</em>, then open Activity Logger from your Home Screen and turn reminders on there.'
        : 'This browser can’t receive reminders while the app is closed. Try Chrome, Edge, Firefox or Safari.';
      return;
    }
    const sub = await currentSubscription().catch(() => null);
    if (sub && Notification.permission === 'granted') {
      box.innerHTML = '<span class="dot"></span>Reminders are on for this device';
      $('nudge').hidden = true;
      // Re-send in case the browser rotated the subscription.
      api('POST', '/api/subscribe', { subscription: sub.toJSON() }).catch(() => {});
    } else {
      box.innerHTML = '<button class="primary" id="enable">Turn on reminders</button>';
      $('nudge').hidden = false;
      $('enable').addEventListener('click', enableReminders);
    }
    if (error) box.insertAdjacentHTML('beforeend', `<p class="err">${error.replace(/</g, '&lt;')}</p>`);
  }

  // ---- Answering --------------------------------------------------------

  async function submit() {
    const text = $('response').value.trim();
    if (!text) { $('response').focus(); return; }
    $('submit').disabled = true;
    $('submit-msg').textContent = '';
    try {
      await api('POST', '/api/answer', { text });
      $('response').value = '';
      $('response').blur();
      store.set('al.draft', null);
      $('logged').textContent = 'Logged at ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      clearTimeout(submit.t);
      submit.t = setTimeout(() => { $('logged').textContent = ''; }, 4000);
      await refresh();
    } catch (err) {
      $('submit-msg').textContent = 'Not logged: ' + err.message + '. Your text is still here.';
    } finally {
      $('submit').disabled = false;
    }
  }

  // ---- Rendering --------------------------------------------------------

  function nextPrompt(settings, now) {
    const day = new Date(now); day.setHours(0, 0, 0, 0);
    for (let i = 0; i < 8; i++) {
      const times = [];
      for (const w of settings.windows) {
        if (!w.days.includes(day.getDay())) continue;
        for (let m = toMin(w.start); m <= toMin(w.end); m += settings.interval) {
          const t = new Date(day); t.setHours(0, m, 0, 0); times.push(t);
        }
      }
      const found = times.sort((a, b) => a - b).find((t) => t > now);
      if (found) return found;
      day.setDate(day.getDate() + 1);
    }
    return null;
  }

  function render() {
    const { settings, pending } = data;
    const time = (d) => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const n = nextPrompt(settings, new Date());
    $('checkin').classList.toggle('pending', Boolean(pending));
    $('checkin-label').textContent = pending ? 'Reminder' : 'Check-in';
    $('checkin-meta').textContent = pending
      ? 'Asked at ' + time(new Date(pending.asked))
      : n ? `Next reminder ${dayLabel(n) === 'Today' ? 'at' : dayLabel(n) + ','} ${time(n)}` : 'No reminders scheduled';
    $('status').textContent = pending ? 'Waiting for your answer · Next' : 'Next reminder';
    $('next-time').textContent = n ? time(n) : '—';
    $('next').textContent = n ? dayLabel(n) : 'No upcoming reminders. Add a time frame in Schedule.';
    if (document.activeElement?.closest?.('#windows') == null && document.activeElement !== $('interval')) renderSchedule();
    renderLog();
  }

  function dayLabel(d) {
    const start = (x) => { const c = new Date(x); c.setHours(0, 0, 0, 0); return c; };
    const diff = Math.round((start(d) - start(new Date())) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff === -1) return 'Yesterday';
    return d.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  }

  let saveTimer = null;
  function saveSettings() {
    clearTimeout(saveTimer);
    $('saved').textContent = 'Saving…';
    saveTimer = setTimeout(async () => {
      try {
        data.settings = (await api('PUT', '/api/settings', {
          ...data.settings, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        })).settings;
        $('saved').textContent = 'Saved';
        render();
      } catch (err) { $('saved').textContent = 'Not saved: ' + err.message; }
    }, 500);
  }

  function renderSchedule() {
    const s = data.settings;
    $('interval').value = s.interval;
    const box = $('windows');
    box.innerHTML = '';
    s.windows.forEach((w, i) => {
      const row = document.createElement('div');
      row.className = 'window';
      row.innerHTML = `
        <div class="times">
          <input type="time" data-f="start" value="${w.start}" aria-label="Start">
          <span class="to">–</span>
          <input type="time" data-f="end" value="${w.end}" aria-label="End">
          <button class="remove" data-remove aria-label="Remove time frame">×</button>
        </div>
        <div class="days">${DAY_ORDER.map((di) =>
          `<label class="day"><input type="checkbox" data-day="${di}" ${w.days.includes(di) ? 'checked' : ''}>${DAY_SHORT[di]}</label>`).join('')}</div>`;
      row.querySelectorAll('input[type=time]').forEach((el) =>
        el.addEventListener('change', () => { if (el.value) { w[el.dataset.f] = el.value; saveSettings(); } }));
      row.querySelectorAll('input[data-day]').forEach((el) =>
        el.addEventListener('change', () => {
          const d = Number(el.dataset.day);
          w.days = el.checked ? [...new Set([...w.days, d])].sort() : w.days.filter((x) => x !== d);
          saveSettings();
        }));
      row.querySelector('[data-remove]').addEventListener('click', () => {
        s.windows.splice(i, 1); renderSchedule(); saveSettings();
      });
      box.appendChild(row);
    });
  }

  function renderLog() {
    const box = $('log');
    box.innerHTML = '';
    const time = (iso) => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    let lastDay = null;
    [...data.log].reverse().forEach((e) => {
      const day = dayLabel(new Date(e.asked));
      if (day !== lastDay) {
        const h = document.createElement('div');
        h.className = 'log-day'; h.textContent = day; box.appendChild(h);
        lastDay = day;
      }
      const row = document.createElement('div');
      row.className = 'entry' + (e.status === 'missed' ? ' missed' : '');
      const t = document.createElement('time');
      t.dateTime = e.asked; t.textContent = time(e.asked);
      const body = document.createElement('div');
      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = e.status === 'missed' ? 'Missed' : e.response;
      body.appendChild(text);
      if (e.status !== 'missed' && e.answered) {
        const mins = Math.round((new Date(e.answered) - new Date(e.asked)) / 60000);
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = mins < 1 ? 'Answered right away' : `Answered at ${time(e.answered)}`;
        body.appendChild(meta);
      }
      row.append(t, body);
      box.appendChild(row);
    });
    $('empty').hidden = data.log.length > 0;
  }

  function exportCsv() {
    const esc = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
    const rows = [['asked', 'answered', 'status', 'response']]
      .concat(data.log.map((e) => [e.asked, e.answered ?? '', e.status, e.response]));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map(esc).join(',')).join('\n')], { type: 'text/csv' }));
    a.download = `activity-log-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ---- Views and menu ---------------------------------------------------

  const TITLES = { log: 'Log', schedule: 'Schedule', reminders: 'Reminders' };
  let view = 'home';

  function show(next, { push = true } = {}) {
    view = next;
    document.querySelectorAll('[data-view]').forEach((el) => { el.hidden = el.dataset.view !== next; });
    const home = next === 'home';
    $('brand-text').hidden = !home;
    $('view-title').hidden = home;
    $('view-title').textContent = TITLES[next] || '';
    document.querySelectorAll('.nav-item').forEach((el) =>
      el.dataset.go === next ? el.setAttribute('aria-current', 'page') : el.removeAttribute('aria-current'));
    menu(false);
    window.scrollTo(0, 0);
    // Keep history to at most one step: home -> a menu page. Back always returns home.
    if (push && history.state?.view !== next) {
      if (history.state?.view === 'home') history.pushState({ view: next }, '');
      else history.replaceState({ view: next }, '');
    }
  }

  function goHome() {
    if (history.state && history.state.view !== 'home') history.back(); // popstate shows home
    else show('home', { push: false });
  }

  function menu(open) {
    document.body.classList.toggle('menu-open', open);
    $('menu-btn').setAttribute('aria-expanded', String(open));
    $('drawer').inert = !open;
  }

  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) go.dataset.go === 'home' ? (menu(false), goHome()) : show(go.dataset.go);
  });
  $('menu-btn').addEventListener('click', () => menu(!document.body.classList.contains('menu-open')));
  $('scrim').addEventListener('click', () => menu(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') menu(false); });
  window.addEventListener('popstate', (e) => show(e.state?.view || 'home', { push: false }));

  // ---- Swipe: right to open the menu, left to close it -------------------

  (() => {
    const drawer = $('drawer'), scrim = $('scrim');
    let sx = 0, sy = 0, st = 0, dx = 0, width = 0, startOpen = false, mode = null;
    const isOpen = () => document.body.classList.contains('menu-open');
    const follow = (offset) => { // 0 = closed, width = fully open
      const f = Math.max(0, Math.min(1, offset / width));
      drawer.style.transform = `translateX(${(f - 1) * 100}%)`;
      scrim.style.opacity = String(f);
    };
    document.addEventListener('touchstart', (e) => {
      mode = null;
      if ($('app').hidden || e.touches.length !== 1 || e.target.closest('input, textarea')) { mode = 'off'; return; }
      const t = e.touches[0];
      sx = t.clientX; sy = t.clientY; st = e.timeStamp; dx = 0;
      startOpen = isOpen(); width = drawer.offsetWidth;
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (mode === 'off') return;
      const t = e.touches[0], mx = t.clientX - sx, my = t.clientY - sy;
      if (mode === null) {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        const horizontal = Math.abs(mx) > Math.abs(my) * 1.2;
        mode = horizontal && (startOpen ? mx < 0 : mx > 0) ? 'drag' : 'off';
        if (mode === 'drag') { document.body.classList.add('dragging'); drawer.inert = false; }
      }
      if (mode !== 'drag') return;
      e.preventDefault();
      dx = mx;
      follow(startOpen ? width + dx : dx);
    }, { passive: false });
    const end = (e) => {
      if (mode !== 'drag') { mode = null; return; }
      const speed = dx / Math.max(1, e.timeStamp - st); // px per ms; a quick flick counts
      const open = startOpen ? !(dx < -width / 3 || speed < -0.35) : (dx > width / 3 || speed > 0.35);
      document.body.classList.remove('dragging');
      drawer.style.transform = ''; scrim.style.opacity = '';
      menu(open);
      mode = null;
    };
    document.addEventListener('touchend', end);
    document.addEventListener('touchcancel', end);
  })();

  // ---- Wiring -----------------------------------------------------------

  $('connect-btn').addEventListener('click', connect);
  $('submit').addEventListener('click', submit);
  $('response').addEventListener('input', () => store.set('al.draft', $('response').value));
  // Return logs the entry; Shift+Return still adds a new line.
  $('response').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  });
  $('test').addEventListener('click', async () => {
    $('test').disabled = true;
    try { await api('POST', '/api/ask'); await refresh(); } catch (err) { $('next').textContent = err.message; }
    $('test').disabled = false;
  });
  $('refresh').addEventListener('click', refresh);
  $('interval').addEventListener('change', (e) => {
    data.settings.interval = Math.min(240, Math.max(1, Number(e.target.value) || 10));
    e.target.value = data.settings.interval;
    saveSettings();
  });
  $('add-window').addEventListener('click', () => {
    data.settings.windows.push({ start: '09:00', end: '17:00', days: [1, 2, 3, 4, 5] });
    renderSchedule(); saveSettings();
  });
  $('export').addEventListener('click', exportCsv);
  $('clear').addEventListener('click', async () => {
    if (!confirm('Delete every log entry? This cannot be undone.')) return;
    try { await api('DELETE', '/api/log'); await refresh(); } catch (err) { alert(err.message); }
  });
  $('disconnect').addEventListener('click', async () => {
    if (!confirm('Stop reminders on this device and forget the app key?')) return;
    const sub = await currentSubscription().catch(() => null);
    if (sub) { await api('POST', '/api/unsubscribe', { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
    store.set('al.key', null);
    key = '';
    $('menu-btn').hidden = true;
    show('home', { push: false });
    $('app').hidden = true;
    showConnect();
  });
  navigator.serviceWorker?.addEventListener('message', (e) => { if (e.data === 'refresh') refresh(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && key) refresh(); });

  async function start() {
    $('connect').hidden = true;
    $('app').hidden = false;
    $('menu-btn').hidden = false;
    history.replaceState({ view: 'home' }, '');
    show('home', { push: false });
    $('response').value = store.get('al.draft') || '';
    await refresh();
    renderReminders();
    if (new URLSearchParams(location.search).has('answer')) $('response').focus();
    setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 60 * 1000);
  }

  if (server && key) start(); else showConnect();
})();
</script>
</body>
</html>
