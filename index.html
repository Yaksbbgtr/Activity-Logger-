<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activity Logger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Activity">
<meta name="theme-color" content="#2f6fed">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085;
    --border: #d9dde5; --accent: #2f6fed; --accent-text: #fff; --warn: #b42318; --ok: #067647;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e7eaf0; --muted: #98a2b3;
      --border: #2d3442; --accent: #5b8cff; --accent-text: #0b1020; --warn: #f97066; --ok: #47cd89;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  h2 { margin: 0 0 12px; font-size: 1.1rem; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  button:disabled { opacity: .6; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--warn); }
  input, textarea {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; max-width: 100%;
  }
  input[type=text], input[type=url], input[type=password] { width: 100%; }
  textarea { width: 100%; min-height: 90px; resize: vertical; }
  label.block { display: block; margin-bottom: 10px; }
  .status { font-weight: 600; }
  .muted { color: var(--muted); }
  .ok { color: var(--ok); }
  .err { color: var(--warn); }
  .window { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
            padding: 10px 0; border-bottom: 1px solid var(--border); }
  .days label { font-size: 0.85rem; margin-right: 6px; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.resp { white-space: pre-wrap; word-break: break-word; }
  td.missed { color: var(--warn); }
  .table-wrap { overflow-x: auto; }
  #prompt { border: 2px solid var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Activity Logger</h1>
  <p class="sub">Reminds you at a set interval during your chosen hours, even when the app is closed, and logs each answer with a timestamp.</p>

  <!-- Shown until the app knows its server and key -->
  <section class="card" id="connect" hidden>
    <h2>Connect</h2>
    <label class="block" id="server-field">Server address
      <input type="url" id="server" placeholder="https://activity-logger.example.workers.dev" autocomplete="off">
    </label>
    <label class="block">App key
      <input type="password" id="key" autocomplete="off">
    </label>
    <div class="row"><button class="primary" id="connect-btn">Connect</button><span id="connect-msg" class="err"></span></div>
  </section>

  <div id="app" hidden>
    <section class="card" id="prompt" hidden>
      <h2>What are you doing right now?</h2>
      <p class="muted" id="prompt-time"></p>
      <textarea id="response" placeholder="Type your answer…" enterkeyhint="send"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="submit">Log it</button>
        <span id="submit-msg" class="err"></span>
      </div>
    </section>

    <section class="card">
      <div class="status" id="status">Loading…</div>
      <div class="muted" id="next"></div>
      <div id="reminders" style="margin-top:12px"></div>
      <div class="row" style="margin-top:12px">
        <button id="test">Ask me now</button>
        <button id="refresh">Refresh</button>
      </div>
    </section>

    <section class="card">
      <h2>Schedule</h2>
      <div class="row">
        <label>Ask every <input id="interval" type="number" inputmode="numeric" min="1" max="240" style="width:72px"> minutes</label>
      </div>
      <div id="windows"></div>
      <div class="row" style="margin-top:10px">
        <button id="add-window">+ Add time frame</button>
        <span class="muted" id="saved"></span>
      </div>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:8px">
        <h2 style="margin:0">Log</h2>
        <div class="row">
          <button id="export">Export CSV</button>
          <button class="danger" id="clear">Clear log</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Asked</th><th>Answered</th><th>Response</th></tr></thead>
          <tbody id="log"></tbody>
        </table>
      </div>
      <p class="muted" id="empty">No entries yet.</p>
    </section>

    <p class="muted"><button id="disconnect">Disconnect this device</button></p>
  </div>
</main>

<script src="config.js?v=2"></script>
<script>
(() => {
  const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };
  const fmt = (iso) => (iso ? new Date(iso).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) : '');
  const toMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const installed = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

  const DEFAULT_SERVER = window.ACTIVITY_LOGGER_SERVER || 'https://activity-logger.activity-logger-worker.workers.dev';
  let server = (store.get('al.server') || DEFAULT_SERVER).replace(/\/+$/, '');
  let key = store.get('al.key') || '';
  let data = { settings: null, pending: null, log: [], devices: 0 };
  let swReg = null;

  // ---- Server ------------------------------------------------------------

  async function api(method, path, body) {
    const res = await fetch(server + path, {
      method,
      headers: { Authorization: 'Bearer ' + key, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(json.error || `Server error ${res.status}`), { status: res.status });
    return json;
  }

  async function refresh() {
    try {
      data = await api('GET', '/api/state');
      // Keep the server's time zone in step with this device.
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (tz && data.settings.timezone !== tz) {
        data.settings = (await api('PUT', '/api/settings', { ...data.settings, timezone: tz })).settings;
      }
      render();
    } catch (err) {
      if (err.status === 401) { showConnect('That app key was not accepted.'); return; }
      $('status').textContent = 'Can’t reach the server';
      $('next').textContent = err.message;
    }
  }

  // ---- Connect ----------------------------------------------------------

  function showConnect(msg = '') {
    $('connect').hidden = false;
    $('app').hidden = true;
    $('server').value = server;
    $('server-field').hidden = Boolean(server);
    $('connect-msg').textContent = msg;
  }

  async function connect() {
    server = ($('server').value.trim() || DEFAULT_SERVER).replace(/\/+$/, '');
    key = $('key').value.trim();
    if (!key) { $('connect-msg').textContent = 'Enter your app key.'; return; }
    $('connect-btn').disabled = true;
    try {
      await api('GET', '/api/state');
      store.set('al.server', server);
      store.set('al.key', key);
      start();
    } catch (err) {
      $('connect-msg').textContent = err.status === 401 ? 'That app key was not accepted.' : 'Could not reach the server. Check your connection and try again.';
    } finally {
      $('connect-btn').disabled = false;
    }
  }

  // ---- Push reminders ---------------------------------------------------

  async function currentSubscription() {
    if (!pushSupported) return null;
    swReg = swReg || await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    return swReg.pushManager.getSubscription();
  }

  async function enableReminders() {
    const btn = $('enable');
    btn.disabled = true;
    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') { renderReminders('Notifications were not allowed. You can allow them in Settings.'); return; }
      const { key: vapidKey } = await api('GET', '/api/vapid-key');
      if (!vapidKey) throw new Error('Server has no push key configured.');
      await currentSubscription();
      const sub = await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidKey });
      await api('POST', '/api/subscribe', { subscription: sub.toJSON() });
      await refresh();
      renderReminders();
    } catch (err) {
      renderReminders('Could not turn on reminders: ' + err.message);
    } finally {
      btn && (btn.disabled = false);
    }
  }

  async function renderReminders(error = '') {
    const box = $('reminders');
    if (!pushSupported || (isIOS && !installed)) {
      box.innerHTML = isIOS
        ? '<strong>To get reminders on iPhone:</strong> tap the Share button, choose <em>Add to Home Screen</em>, then open Activity Logger from your Home Screen and turn reminders on there.'
        : 'This browser can’t receive reminders while the app is closed. Try Chrome, Edge, Firefox or Safari.';
      return;
    }
    const sub = await currentSubscription().catch(() => null);
    if (sub && Notification.permission === 'granted') {
      box.innerHTML = '<span class="ok">✓ Reminders are on for this device.</span>';
      // Re-send in case the browser rotated the subscription.
      api('POST', '/api/subscribe', { subscription: sub.toJSON() }).catch(() => {});
    } else {
      box.innerHTML = '<button class="primary" id="enable">Turn on reminders</button>';
      $('enable').addEventListener('click', enableReminders);
    }
    if (error) box.insertAdjacentHTML('beforeend', `<p class="err">${error.replace(/</g, '&lt;')}</p>`);
  }

  // ---- Answering --------------------------------------------------------

  async function submit() {
    const text = $('response').value.trim();
    if (!text) { $('response').focus(); return; }
    $('submit').disabled = true;
    $('submit-msg').textContent = '';
    try {
      await api('POST', '/api/answer', { text });
      $('response').value = '';
      store.set('al.draft', null);
      await refresh();
    } catch (err) {
      $('submit-msg').textContent = err.status === 409 ? 'That question already closed. Your text is still here.' : err.message;
    } finally {
      $('submit').disabled = false;
    }
  }

  // ---- Rendering --------------------------------------------------------

  function nextPrompt(settings, now) {
    const day = new Date(now); day.setHours(0, 0, 0, 0);
    for (let i = 0; i < 8; i++) {
      const times = [];
      for (const w of settings.windows) {
        if (!w.days.includes(day.getDay())) continue;
        for (let m = toMin(w.start); m <= toMin(w.end); m += settings.interval) {
          const t = new Date(day); t.setHours(0, m, 0, 0); times.push(t);
        }
      }
      const found = times.sort((a, b) => a - b).find((t) => t > now);
      if (found) return found;
      day.setDate(day.getDate() + 1);
    }
    return null;
  }

  function render() {
    const { settings, pending } = data;
    $('prompt').hidden = !pending;
    if (pending) $('prompt-time').textContent = 'Asked ' + fmt(pending.asked);
    $('status').textContent = pending ? 'Waiting for your answer' : 'All caught up';
    const n = nextPrompt(settings, new Date());
    $('next').textContent = n
      ? 'Next reminder: ' + n.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })
      : 'No upcoming reminders. Add a time frame below.';
    if (document.activeElement?.closest?.('#windows') == null && document.activeElement !== $('interval')) renderSchedule();
    renderLog();
  }

  let saveTimer = null;
  function saveSettings() {
    clearTimeout(saveTimer);
    $('saved').textContent = 'Saving…';
    saveTimer = setTimeout(async () => {
      try {
        data.settings = (await api('PUT', '/api/settings', {
          ...data.settings, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        })).settings;
        $('saved').textContent = 'Saved';
        render();
      } catch (err) { $('saved').textContent = 'Not saved: ' + err.message; }
    }, 500);
  }

  function renderSchedule() {
    const s = data.settings;
    $('interval').value = s.interval;
    const box = $('windows');
    box.innerHTML = '';
    s.windows.forEach((w, i) => {
      const row = document.createElement('div');
      row.className = 'window';
      row.innerHTML = `
        <input type="time" data-f="start" value="${w.start}"> to
        <input type="time" data-f="end" value="${w.end}">
        <span class="days">${DAY_NAMES.map((d, di) =>
          `<label><input type="checkbox" data-day="${di}" ${w.days.includes(di) ? 'checked' : ''}> ${d}</label>`).join('')}</span>
        <button class="danger" data-remove>Remove</button>`;
      row.querySelectorAll('input[type=time]').forEach((el) =>
        el.addEventListener('change', () => { if (el.value) { w[el.dataset.f] = el.value; saveSettings(); } }));
      row.querySelectorAll('input[data-day]').forEach((el) =>
        el.addEventListener('change', () => {
          const d = Number(el.dataset.day);
          w.days = el.checked ? [...new Set([...w.days, d])].sort() : w.days.filter((x) => x !== d);
          saveSettings();
        }));
      row.querySelector('[data-remove]').addEventListener('click', () => {
        s.windows.splice(i, 1); renderSchedule(); saveSettings();
      });
      box.appendChild(row);
    });
  }

  function renderLog() {
    const body = $('log');
    body.innerHTML = '';
    [...data.log].reverse().forEach((e) => {
      const tr = document.createElement('tr');
      [fmt(e.asked), e.status === 'missed' ? 'Missed' : fmt(e.answered), e.response].forEach((c, ci) => {
        const td = document.createElement('td');
        td.textContent = c;
        if (ci === 2) td.className = 'resp';
        if (ci === 1 && e.status === 'missed') td.className = 'missed';
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    $('empty').hidden = data.log.length > 0;
  }

  function exportCsv() {
    const esc = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
    const rows = [['asked', 'answered', 'status', 'response']]
      .concat(data.log.map((e) => [e.asked, e.answered ?? '', e.status, e.response]));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map(esc).join(',')).join('\n')], { type: 'text/csv' }));
    a.download = `activity-log-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ---- Wiring -----------------------------------------------------------

  $('connect-btn').addEventListener('click', connect);
  $('submit').addEventListener('click', submit);
  $('response').addEventListener('input', () => store.set('al.draft', $('response').value));
  $('response').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submit(); });
  $('test').addEventListener('click', async () => {
    $('test').disabled = true;
    try { await api('POST', '/api/ask'); await refresh(); } catch (err) { $('next').textContent = err.message; }
    $('test').disabled = false;
  });
  $('refresh').addEventListener('click', refresh);
  $('interval').addEventListener('change', (e) => {
    data.settings.interval = Math.min(240, Math.max(1, Number(e.target.value) || 10));
    e.target.value = data.settings.interval;
    saveSettings();
  });
  $('add-window').addEventListener('click', () => {
    data.settings.windows.push({ start: '09:00', end: '17:00', days: [1, 2, 3, 4, 5] });
    renderSchedule(); saveSettings();
  });
  $('export').addEventListener('click', exportCsv);
  $('clear').addEventListener('click', async () => {
    if (!confirm('Delete every log entry? This cannot be undone.')) return;
    try { await api('DELETE', '/api/log'); await refresh(); } catch (err) { alert(err.message); }
  });
  $('disconnect').addEventListener('click', async () => {
    if (!confirm('Stop reminders on this device and forget the app key?')) return;
    const sub = await currentSubscription().catch(() => null);
    if (sub) { await api('POST', '/api/unsubscribe', { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
    store.set('al.key', null);
    key = '';
    showConnect();
  });
  navigator.serviceWorker?.addEventListener('message', (e) => { if (e.data === 'refresh') refresh(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && key) refresh(); });

  async function start() {
    $('connect').hidden = true;
    $('app').hidden = false;
    $('response').value = store.get('al.draft') || '';
    await refresh();
    renderReminders();
    if (data.pending && new URLSearchParams(location.search).has('answer')) $('response').focus();
    setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 60 * 1000);
  }

  if (server && key) start(); else showConnect();
})();
</script>
</body>
</html>
